#!KAMAILIO

# === Define/Load Environment Variables ===
#!substdef "/MY_DB_URL/$env(DB_URL)/"

# === Global Parameters ===
listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
listen=tcp:0.0.0.0:8080

# Handle HTTP requests with no content-length
tcp_accept_no_cl=yes

# === Loaded Modules ===
# 1. Core SIP handling modules first
loadmodule "tm.so"          
loadmodule "sl.so"
loadmodule "maxfwd.so"
loadmodule "pv.so"

# 2. Database and Registration
loadmodule "db_postgres.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"

# 3. HTTP and Python
loadmodule "xhttp.so"
loadmodule "app_python3.so"

# === Database Configuration ===
modparam("usrloc", "db_url", "MY_DB_URL")
modparam("usrloc", "db_mode", 1)

# === Python 3 / KEMI Configuration ===
modparam("app_python3", "load", "/etc/kamailio/redial_service.py")

# === Router Block (SIP) === 
route {
    if (!python_exec("sip_route")) {
        sl_send_reply("500", "Internal Server Error");
    }
}

# === HTTP Request Handler (sanity check) ===
event_route[xhttp:request] {
    python_exec("http_route");
}
