#!KAMAILIO

debug=2
log_stderror=yes
log_facility=LOG_LOCAL0

####### Modules Section #######
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "pv.so"
loadmodule "ctl.so"
loadmodule "app_python3.so"
loadmodule "maxfwd.so"
loadmodule "rr.so"
loadmodule "xlog.so"

# Load htable module
loadmodule "htable.so"

####### Module Parameters #######
modparam("ctl", "binrpc", "unix:/var/run/kamailio/kamailio_ctl")

# Define a hash table named "loc"
# size=4 (small for testing)
# autoexpire=600 (records delete themselves after 10 mins)
modparam("htable", "htable", "loc=>size=4;autoexpire=600;")

modparam("app_python3", "script_name", "/etc/kamailio/redial_service.py")

####### Routing Logic #######
route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483","Too Many Hops");
        exit;
    }

    if(!python_exec("sip_route")) {
        sl_send_reply("500", "Internal Server Error");
        exit;
    }
}

failure_route[app_failure_route] {
    python_exec("app_failure_route");
}
