#!KAMAILIO

debug=2
log_stderror=yes
log_facility=LOG_LOCAL0
fork=yes
children=4
# disable strict VIA checking for NAT scenarios
check_via=no      
sip_warning=no

# Ports
listen=udp:acme.operador:5060 advertise acme.operador:5060
listen=tcp:acme.operador:5060 advertise acme.operador:5060
alias="acme.operador"

####### Modules Section #######
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "pv.so"
loadmodule "ctl.so"
loadmodule "maxfwd.so"
loadmodule "rr.so"
loadmodule "xlog.so"
loadmodule "textops.so"
loadmodule "siputils.so"

loadmodule "usrloc.so"
loadmodule "registrar.so"

loadmodule "htable.so"
loadmodule "app_python3.so"

####### Module Parameters #######
modparam("ctl", "binrpc", "unix:/var/run/kamailio/kamailio_ctl")
# Enable standard loose routing behaviour
modparam("rr", "enable_full_lr", 1)
# Check if the direction is strictly downstream
modparam("usrloc", "db_mode", 0)
modparam("usrloc", "matching_mode", 0)

modparam("htable", "htable", "aor=>size=8") 
modparam("htable", "htable", "kpi=>size=8")

modparam("app_python3", "script_name", "/etc/kamailio/redial_service.py")

####### Routing Logic #######
route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483","Too Many Hops");
        exit;
    }
    
    if (has_totag()) {
        if (loose_route()) {
            if (is_method("BYE")) {
                python_exec("cleanup_on_bye");
            }
            # For ACKs and BYEs handled by loose_route just relay
            t_relay();
            exit;
        }
    }
    if (is_method("INVITE")) {
        record_route();
        # Explicitly tell TM to use the native 'app_reply_route' block
        # whenever a reply (like 200 OK) comes back for this call.
        t_on_reply("app_reply_route");
    }

    # Hand off all logic to Python service
    # python_exec returns true if Python returns 1, false if 0.
    if(!python_exec("app_main_route")) {
        xlog("L_ERR", "Error in Python script execution\n");
        sl_send_reply("500", "Internal Server Error");
        exit;
    }
}

# Triggered if Python does t_on_failure("app_failure_route")
failure_route[app_failure_route] {
    if(!python_exec("app_failure_route")) {
        xlog("L_ERR", "Error in Python failure route\n");
    }
}

# The golden redial route logic
failure_route[app_redial_route] {
    if(!python_exec("app_redial_route")) {
        xlog("L_ERR", "Error in Python redial route\n");
    }
}

onreply_route[app_reply_route] {
    if(!python_exec("app_reply_route")) {
        xlog("L_ERR", "Error in Python reply route\n");
    }
}

# Initialise usrloc table hack
route[force_usrloc_init] {
    save("location");
}
